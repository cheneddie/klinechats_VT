name: Browser release QA

on:
  push:
    branches: [main, research-integrity-p0]
    paths:
      - index.html
      - v5.html
      - strategy-lab.html
      - src/v2/**
      - src/v3/**
      - src/v4/**
      - src/v5/**
      - scripts/qa-browser-contract.mjs
      - scripts/qa-strategy-lab-contract.mjs
      - scripts/capture-mastery.mjs
      - scripts/perf-home.mjs
      - scripts/perf-startup.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/browser-release-qa.yml
  pull_request:
    branches: [main, fabio-decision-gym-v4]
  workflow_dispatch:

jobs:
  browser-release:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned frontend runtime
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile
          pnpm add --save-dev --ignore-workspace-root-check --lockfile=false playwright@1.57.0
      - name: Prepare PixiJS vendor bundle
        run: pnpm run vendor:pixi
      - name: Serve Decision Gym
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/fabio-browser-http.log 2>&1 &
          for i in {1..20}; do curl -sf http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/fabio-browser-http.log
          exit 1
      - name: Non-blocking dashboard startup
        run: node scripts/perf-startup.mjs
      - name: Dashboard idle performance
        run: node scripts/perf-home.mjs
      - name: V3.2 interaction contract
        run: node scripts/qa-browser-contract.mjs
      - name: V3.3 mastery contract
        run: node scripts/capture-mastery.mjs
      - name: Strategy Lab browser contract
        run: node scripts/qa-strategy-lab-contract.mjs
