name: Stage screenshot

on:
  push:
    branches: [main]
    paths:
      - PHASE.txt
      - index.html
      - package.json
      - src/v2/**
      - src/v3/**
      - server/**
      - tests/**
      - scripts/qa-v32.mjs
      - scripts/capture-mastery.mjs
      - scripts/vendor-pixi.mjs
      - .github/workflows/stage-screenshot.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: V3 browser module syntax
        run: |
          node --check src/v3/visual-registry.js
          node --check src/v3/node-visuals.js
          node --check src/v3/pixi-layer.js
          node --check src/v3/visual-ui.js
          node --check src/v3/drill.js
          node --check src/v3/mastery-core.js
          node --check src/v3/mastery.js
      - name: Install scanner runtime dependencies
        run: python -m pip install -r requirements-server.txt
      - name: Python scanner tests
        run: |
          python -m py_compile server/__init__.py server/contracts.py server/engine.py server/causal_engine.py server/progress_scanner.py server/scanner.py server/fabio_api.py tests/test_contract_policy.py tests/test_scanner_e2e.py tests/test_scan_progress.py tests/test_decision_price.py
          python tests/test_contract_policy.py
          python tests/test_scanner_e2e.py
          python tests/test_scan_progress.py
          python tests/test_decision_price.py
      - run: npm install --no-save playwright@1.57.0
      - name: Install Playwright Chromium bundle
        run: npx playwright install chromium
      - name: Serve Decision Gym
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/fabio-http.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/fabio-http.log
          exit 1
      - name: V3.2 focused browser release QA
        run: node scripts/qa-v32.mjs
      - name: V3.3 mastery browser QA and screenshots
        run: node scripts/capture-mastery.mjs
      - name: Commit screenshots
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if ! git diff --cached --quiet; then
            git commit -m "test: capture $(cat PHASE.txt) Decision Gym screenshots"
            git push origin HEAD:main
          fi
