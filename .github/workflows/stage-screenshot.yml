name: Stage screenshot

on:
  push:
    branches: [main]
    paths:
      - PHASE.txt
      - index.html
      - src/v2/**
      - scripts/capture-stage.mjs
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Serve Decision Gym
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/fabio-http.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/fabio-http.log
          exit 1
      - name: Browser runtime QA and screenshots
        run: node scripts/capture-stage.mjs
      - name: Commit screenshots
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if ! git diff --cached --quiet; then
            git commit -m "test: capture $(cat PHASE.txt) Decision Gym screenshots"
            git push origin HEAD:main
          fi
