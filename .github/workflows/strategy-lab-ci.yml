name: Strategy Lab CI
on:
  push:
    branches: [research-integrity-p0]
  pull_request:
    branches: [fabio-decision-gym-v4]

jobs:
  strategy-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          python -m pip install -r requirements-server.txt
          python -m pip install pytest
      - name: Compile Strategy Lab
        run: |
          python -m py_compile \
            server/v5/strategy_registry.py \
            server/v5/strategy_storage.py \
            server/v5/execution.py \
            server/v5/diagnostics.py \
            server/v5/reporting.py \
            server/v5/backtest.py \
            server/v5/optimizer.py \
            server/v5/monitor.py
      - name: Strategy Lab tests
        run: |
          set -o pipefail
          python -m pytest -q tests/test_strategy_lab.py 2>&1 | tee strategy-lab-pytest.log
      - name: P0 regression
        run: python -m pytest -q tests/test_v5_research_integrity.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-ci-${{ github.sha }}
          path: strategy-lab-pytest.log
          if-no-files-found: ignore
