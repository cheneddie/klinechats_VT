name: V4 CI

on:
  push:
    branches: [fabio-decision-gym-v4]
  pull_request:
    branches: [main]

jobs:
  v4-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: Existing + V4 JS tests
        run: npm test
      - name: V4 browser module syntax
        run: |
          node --check src/v4/chart.js
          node --check src/v4/practice.js
          node --check src/v4/replay.js
          node --check src/v4/research.js
      - name: Production build
        run: npm run build
      - name: Install scanner runtime dependencies
        run: python -m pip install -r requirements-server.txt
      - name: V4 Python syntax
        run: |
          python -m py_compile server/v4_engine.py server/v4_replay.py server/v4_audit.py server/v4_api.py server/fabio_api_v4.py
          python -m py_compile tests/test_v4_node_semantics.py tests/test_v4_replay.py tests/test_v4_reverse_audit.py
      - name: Distinct causal node semantics
        run: python tests/test_v4_node_semantics.py
      - name: Trading-day replay + timeframe aggregation
        run: python tests/test_v4_replay.py
      - name: Reverse node edge audit
        run: python tests/test_v4_reverse_audit.py
      - name: V4 artifact contract
        run: |
          test -s src/v4/chart.js
          test -s src/v4/practice.js
          test -s src/v4/replay.js
          test -s src/v4/research.js
          test -s src/v4/v4.css
          test -s server/v4_engine.py
          test -s server/v4_replay.py
          test -s server/v4_audit.py
          test -s server/v4_api.py
          grep -q 'Fabio Decision Gym V4' index.html
