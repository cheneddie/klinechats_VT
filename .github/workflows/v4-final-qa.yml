name: V4 Final QA Watchdog

on:
  push:
    branches: [fabio-decision-gym-v4]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QA_ROOT: ${{ github.workspace }}/qa-data
      QA_DB: ${{ github.workspace }}/qa-artifacts/fabio-events.sqlite3
      QA_OUT: ${{ github.workspace }}/qa-artifacts
      QA_BASE_URL: http://127.0.0.1:4173
      QA_API_URL: http://127.0.0.1:8765/api
      FABIO_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize QA heartbeat
        run: |
          mkdir -p qa-artifacts qa-data
          printf '{"stage":"workflow-init","ok":false,"sha":"%s"}\n' "$GITHUB_SHA" > qa-artifacts/workflow-status.json

      - name: Install dependencies with timeout
        timeout-minutes: 4
        run: |
          timeout 180s npm install --ignore-scripts
          timeout 180s python -m pip install -r requirements-server.txt
          timeout 180s npm install --no-save playwright@1.57.0
          timeout 180s npx playwright install chromium

      - name: Production build
        timeout-minutes: 2
        run: |
          echo '{"stage":"build","ok":false}' > qa-artifacts/workflow-status.json
          timeout 90s npm run build
          echo '{"stage":"build","ok":true}' > qa-artifacts/workflow-status.json

      - name: V4 final causal tests
        timeout-minutes: 3
        run: |
          echo '{"stage":"python-tests","ok":false}' > qa-artifacts/workflow-status.json
          timeout 60s python tests/test_v4_node_semantics.py
          timeout 60s python tests/test_v4_replay.py
          timeout 60s python tests/test_v4_reverse_audit.py
          timeout 60s python tests/test_v4_unbiased_universe.py
          timeout 60s python tests/test_v4_replay_causality.py
          timeout 60s python tests/test_v4_research_release.py
          timeout 60s python tests/test_v4_multiyear.py
          timeout 60s python tests/test_v4_scan_audit.py
          timeout 60s python tests/test_v4_execution_stress.py
          timeout 60s python tests/test_v4_stratified.py
          echo '{"stage":"python-tests","ok":true}' > qa-artifacts/workflow-status.json

      - name: Seed real API QA environment
        timeout-minutes: 1
        run: |
          echo '{"stage":"seed","ok":false}' > qa-artifacts/workflow-status.json
          timeout 45s python tests/seed_v4_qa_env.py --root "$QA_ROOT" --db "$QA_DB" --manifest qa-artifacts/seed.json
          echo '{"stage":"seed","ok":true}' > qa-artifacts/workflow-status.json

      - name: Start V4 API and frontend
        timeout-minutes: 1
        run: |
          echo '{"stage":"serve","ok":false}' > qa-artifacts/workflow-status.json
          FABIO_DATA_ROOT="$QA_ROOT" FABIO_EVENT_DB="$QA_DB" FABIO_API_PORT=8765 FABIO_GIT_COMMIT="$GITHUB_SHA" \
            python -m server.fabio_api_v4 > qa-artifacts/api.log 2>&1 &
          echo $! > qa-artifacts/api.pid
          python3 -m http.server 4173 --bind 127.0.0.1 > qa-artifacts/http.log 2>&1 &
          echo $! > qa-artifacts/http.pid
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8765/api/v4/health > qa-artifacts/health.json && curl -sf http://127.0.0.1:4173/ >/dev/null; then
              curl -sf http://127.0.0.1:8765/api/v4/research/provenance > qa-artifacts/provenance.json
              echo '{"stage":"serve","ok":true}' > qa-artifacts/workflow-status.json
              exit 0
            fi
            sleep 1
          done
          echo '--- API LOG ---'; cat qa-artifacts/api.log || true
          echo '--- HTTP LOG ---'; cat qa-artifacts/http.log || true
          exit 1

      - name: Watchdog browser QA with screenshots
        timeout-minutes: 4
        run: |
          echo '{"stage":"browser-watchdog","ok":false}' > qa-artifacts/workflow-status.json
          timeout 180s node scripts/qa-v4-watchdog.mjs
          echo '{"stage":"browser-watchdog","ok":true}' > qa-artifacts/workflow-status.json

      - name: Network failure watchdog
        timeout-minutes: 2
        run: |
          echo '{"stage":"network-watchdog","ok":false}' > qa-artifacts/workflow-status.json
          timeout 90s node scripts/qa-v4-network.mjs
          echo '{"stage":"network-watchdog","ok":true}' > qa-artifacts/workflow-status.json

      - name: Snapshot service state and validated source
        if: always()
        run: |
          curl -sS http://127.0.0.1:8765/api/v4/health > qa-artifacts/final-health.json 2>&1 || true
          curl -sS http://127.0.0.1:8765/api/v4/research/provenance > qa-artifacts/final-provenance.json 2>&1 || true
          curl -sS http://127.0.0.1:8765/api/v4/research/strict-summary > qa-artifacts/final-strict-summary.json 2>&1 || true
          curl -sS http://127.0.0.1:8765/api/v4/research/multi-year-edge > qa-artifacts/final-multi-year-edge.json 2>&1 || true
          curl -sS http://127.0.0.1:8765/api/v4/research/stratified-edge > qa-artifacts/final-stratified-edge.json 2>&1 || true
          curl -sS http://127.0.0.1:8765/api/v4/research/execution-stress > qa-artifacts/final-execution-stress.json 2>&1 || true
          curl -sS http://127.0.0.1:8765/api/v4/research/production-gate > qa-artifacts/final-production-gate.json 2>&1 || true
          curl -sS http://127.0.0.1:8765/api/v4/sanity/latest > qa-artifacts/final-sanity.json 2>&1 || true
          curl -sS http://127.0.0.1:8765/api/v4/audit/jobs > qa-artifacts/final-audit-jobs.json 2>&1 || true
          ps -ef > qa-artifacts/processes.txt || true
          tar -czf qa-artifacts/v4-diagnostic-source.tgz \
            server/engine.py server/contracts.py server/causal_engine.py server/progress_scanner.py \
            server/v4_engine.py server/v4_final_engine.py server/v4_release_engine.py \
            server/v4_audit.py server/v4_audit_final.py server/v4_research_release.py \
            server/v4_multiyear.py server/v4_multiyear_api.py server/v4_execution_stress.py server/v4_stratified.py \
            server/v4_replay.py server/v4_replay_final.py server/v4_research_api.py \
            tools/run_v4_diagnostic.py config \
            tests/test_v4_unbiased_universe.py tests/test_v4_replay_causality.py \
            tests/test_v4_research_release.py tests/test_v4_multiyear.py tests/test_v4_scan_audit.py \
            tests/test_v4_execution_stress.py tests/test_v4_stratified.py requirements-server.txt 2>/dev/null || true
          mkdir -p qa-artifacts/wheels
          python -m pip download --no-deps --only-binary=:all: \
            --implementation cp --python-version 3.13 --abi cp313 --platform manylinux_2_28_x86_64 \
            pyarrow==24.0.0 -d qa-artifacts/wheels || true

      - name: Upload watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-final-qa-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Final evidence contract
        if: success()
        run: |
          test -s qa-artifacts/qa-status.json
          test -s qa-artifacts/network-errors.json
          test -s qa-artifacts/provenance.json
          test -s qa-artifacts/final-stratified-edge.json
          test -s qa-artifacts/final-execution-stress.json
          test -s qa-artifacts/final-production-gate.json
          test -s qa-artifacts/v4-diagnostic-source.tgz
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('qa-artifacts/qa-status.json').read_text())
          n=json.loads(Path('qa-artifacts/network-errors.json').read_text())
          p=json.loads(Path('qa-artifacts/provenance.json').read_text())
          s=json.loads(Path('qa-artifacts/final-stratified-edge.json').read_text())
          e=json.loads(Path('qa-artifacts/final-execution-stress.json').read_text())
          g=json.loads(Path('qa-artifacts/final-production-gate.json').read_text())
          assert q.get('ok') is True, q
          assert q.get('stage') == 'FINAL:PASS', q.get('stage')
          assert len(q.get('screenshots') or []) >= 6, q.get('screenshots')
          assert q.get('checks',{}).get('practiceCanvases',0) >= 1
          assert q.get('checks',{}).get('latestAuditItems',0) >= 1
          assert n.get('ok') is True, n
          assert int(p.get('sqlite_user_version') or 0) >= 5, p
          assert p.get('config_hash'), p
          assert s.get('version'), s
          assert e.get('latency',{}).get('status') == 'PENDING_FROZEN_SPEC', e
          assert g.get('strategies') is not None, g
          assert all(not x.get('live_approved') for x in g.get('strategies',{}).values()), g
          print('V4 final watchdog evidence: PASS')
          PY
