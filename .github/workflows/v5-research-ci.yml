name: V5 Research CI
on:
  push:
    branches: [fabio-decision-gym-v4, research-integrity-p0]
  pull_request:
    branches: [main, fabio-decision-gym-v4]
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime
        run: |
          python -m pip install -r requirements-server.txt
          python -m pip install pytest
      - name: V5 syntax
        run: python -m py_compile server/v5/*.py server/fabio_api_v5.py
      - name: V5 research integrity and training integration
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_v5_layer.py tests/test_v5_research_integrity.py 2>&1 | tee pytest-v5.log
      - name: V4 causal regression
        run: |
          python tests/test_v4_node_semantics.py
          python tests/test_v4_replay_causality.py
          python tests/test_v4_unbiased_universe.py
      - name: V5 artifact contract
        run: |
          test -s config/research/node_registry.yaml
          test -s docs/V5_ENGINEERING_RULES.md
          test -s server/v5/storage.py
          test -s server/v5/campaigns.py
          test -s server/v5/statistics.py
          test -s server/v5/sanity.py
          test -s server/v5/outcomes.py
          test -s server/v5/research.py
          test -s server/v5/training.py
          test -s server/v5/certification.py
          test -s server/v5/api.py
          test -s server/fabio_api_v5.py
      - name: Upload V5 research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-research-ci-${{ github.sha }}
          path: pytest-v5.log
          if-no-files-found: ignore
